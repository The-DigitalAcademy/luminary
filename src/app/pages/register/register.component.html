<div class="grid place-items-center h-screen">
  <div class="text-center justtify-center items-center gap-10">
    <form class="mt-30 flex flex-col gap-5 mx-[3rem]" (ngSubmit)="onSubmit()">
      <div class="text-center font-bold text-2xl mt-10">
        Register
      </div>
      <input type="text" placeholder="First Name" [(ngModel)]="user.name" name="name" class="border-2 border-gray-400 rounded-lg p-2 outline-none">
      <input type="text" placeholder="Last Name" [(ngModel)]="user.surname" name="surname" class="border-2 border-gray-400 rounded-lg p-2 outline-none">
      <input type="text" placeholder="Email" [(ngModel)]="user.email" name="email" class="border-2 border-gray-400 rounded-lg p-2 outline-none">
      <input type="password" placeholder="Password" [(ngModel)]="user.password" name="password" class="border-2 border-gray-400 rounded-lg p-2 outline-none">
      <input type="password" placeholder="Confirm Password" [(ngModel)]="confirmPassword" name="confirmPassword" class="border-2 border-gray-400 rounded-lg p-2 outline-none">
     <app-button type="submit" label="Register"  class=" text-center bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 px-4 rounded-lg" />
    </form><br>
    <p>Already have an account? <a href="/login" class="text-slate-500 hover:underline">Login</a></p>
</div>
