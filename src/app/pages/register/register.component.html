<div class=" block h-[35rem] w-[30rem] bg-slate-50 text-black mx-auto mt-30 justify-center items-center gap-10 rounded-lg shadow-sm">

  <div class="text-center justtify-center items-center gap-10">

    <form class="mt-30 flex flex-col gap-5 mx-[3rem]">
      <div class="text-center font-bold text-2xl mt-10">
        Register
      </div>
      <input type="text" placeholder="First Name" class="border-2 border-gray-400 rounded-lg p-2">
      <input type="text" placeholder="Last Name" class="border-2 border-gray-400 rounded-lg p-2">
      <input type="text" placeholder="Email" class="border-2 border-gray-400 rounded-lg p-2">
      <input type="password" placeholder="Password" class="border-2 border-gray-400 rounded-lg p-2">
      <input type="text" placeholder="Confirm Password" class="border-2 border-gray-400 rounded-lg p-2">
     <app-button label="Register" (onClick)="register()" class=" text-center bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 px-4 rounded-lg" />
    </form><br>
    <p>Already have an account? <a href="/login" class="text-slate-500 hover:underline">Login</a></p>
  </div>

</div>
